name: terraform docs
description: Leverages terraform-docs/gh-actions to generate README.md for the terraform module or stack
inputs:
  working_directory:
    description: The root of the terraform config files (.)
    required: true
  tfdocs-config-path:
    description: filepath with in the repo to load tfdocs config from
    required: true
  github-token:
    description: Uses token as input since it cant be defined within action.yml
    required: false

runs:
  using: composite
  steps:
    - id: terraform-docs
      uses: terraform-docs/gh-actions@d1c99433f7a1e5003ef213d70f89aaa47cb0b675
      with:
        working-dir: ${{ inputs.working_directory }}
        config-file: ${{ inputs.tfdocs-config-path }}
        output-file: README.md
        output-method: replace
        git-push: "true"

    - id: stop-workflow
      if: "${{ inputs.github-token != ''}}"
      run: |
        if ((${{steps.terraform-docs.outputs.num_changed}} > 0)); then
          gh run cancel ${{ github.run_id }}
          gh run watch ${{ github.run_id }}
        fi
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
